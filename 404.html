<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOT LAB — Redirigiendo…</title>
    <meta name="robots" content="noindex" />
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0e0e1a;
            font-family: 'Segoe UI', sans-serif;
            color: #a0a0c0;
            font-size: 1rem;
        }
        .msg {
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.4s ease 0.1s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        .msg span { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
    </style>
    <script>
        // ── GitHub Pages SPA 404 Redirect ──────────────────────────────────
        // GitHub Pages no soporta history-API routing: devuelve 404 para cualquier
        // sub-ruta que no exista como archivo. Este 404.html captura la URL completa,
        // la codifica en un query param "r" y redirige a index.html para que router.js
        // la procese y restaure la ventana correcta.
        (function () {
            var origin = window.location.origin;
            var pathname = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            // Construir la URL de redirección apuntando a la raíz del repo
            // Detectar la base del repo (primer segmento del path, p.ej. /LOT-LAB-sims-4)
            var match = pathname.match(/^(\/[^/]+)(\/.*)?$/);
            var base = match ? match[1] : "";
            var ruta = match ? (match[2] || "/") : pathname;

            var redirectURL = origin + base + "/?r=" + encodeURIComponent(ruta + search) + hash;
            window.location.replace(redirectURL);
        })();
    </script>
</head>
<body>
    <div class="msg">
        <span>🔄</span>
        Redirigiendo…
    </div>
</body>
</html>
